[project]
name = "change-metadata-pooler"
version = "0.1.0"
description = "Cloud Run service for BigQuery change-metadata pooling"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-cloud-bigquery>=3.0,<4.0",
    "google-auth>=2.29.0",
    "cloud-sql-python-connector[pg8000]>=1.12.0,<2.0",
    # Installed from the parent package in the Docker build / editable local install.
    "dbt-bigquery-ext",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
