# PyPI (dbt-bigquery-ext) and GHCR (change-metadata-pooler) in parallel.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pypi:
        description: "Upload to PyPI (needs PYPI_API_TOKEN)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI
    if: ${{ (github.event_name == 'push' || inputs.pypi) && secrets.PYPI_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install -U build twine
          python -m build
          python -m twine upload dist/*

  docker:
    name: GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          v=$(grep -E '^pypi_version' src/dbt/adapters/bigquery/__version__.py | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/change_metadata_pooler/Dockerfile
          push: true
          build-args: |
            PYPI_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/dataeng-ai/change-metadata-pooler:${{ steps.version.outputs.version }}
            ghcr.io/dataeng-ai/change-metadata-pooler:latest
