[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "dbt-bigquery-ext"
description = "DataEng AI fork of dbt-bigquery with execute_ext, Cloud SQL gateway checkpoints, and other extensions. Drop-in replacement for dbt-bigquery (same import path dbt.adapters.bigquery)."
readme = "README.md"
keywords = [
    "dbt",
    "adapter",
    "adapters",
    "database",
    "elt",
    "dbt-core",
    "bigquery",
    "google",
    "dataeng",
]
requires-python = ">=3.10.0"
authors = [{ name = "DataEng AI", email = "dataeng.ai@gmail.com" }]
maintainers = [{ name = "DataEng AI", email = "dataeng.ai@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Drop-in replacement: uninstall upstream first if both are installed.
# pip install "dbt-bigquery-ext"  (provides dbt.adapters.bigquery)
dependencies = [
    "dbt-common>=1.10,<2.0",
    "dbt-adapters>=1.24.4,<2.0",
    # 3.20 introduced pyarrow>=3.0 under the `pandas` extra
    "google-cloud-bigquery[pandas]>=3.0,<4.0",
    "google-cloud-storage>=2.4,<3.2",
    "google-cloud-dataproc~=5.0",
    # ----
    # Expect compatibility with all new versions of these packages, so lower bounds only.
    "google-api-core>=2.11.0",
    "google-auth>=2.29.0",
    # add dbt-core to ensure backwards compatibility of installation, this is not a functional dependency
    "dbt-core>=1.10.0rc0,<2.0",
    "nbformat>=5.10.4",
    "google-cloud-aiplatform>=1.148.0",
    # Cloud SQL IAM gateway (optional until gateway.cloudsql is configured)
    "cloud-sql-python-connector[pg8000]>=1.12.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/dataeng-ai/dbt-bigquery-ext"
Documentation = "https://github.com/dataeng-ai/dbt-bigquery-ext"
Repository = "https://github.com/dataeng-ai/dbt-bigquery-ext"
Issues = "https://github.com/dataeng-ai/dbt-bigquery-ext/issues"
Changelog = "https://github.com/dataeng-ai/dbt-bigquery-ext/blob/main/CHANGELOG.md"
Upstream = "https://github.com/dbt-labs/dbt-adapters/tree/main/dbt-bigquery"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/functional"]
addopts = "-v --color=yes -n auto"
env_files = ["test.env"]
filterwarnings = [
    "ignore:.*'soft_unicode' has been renamed to 'soft_str'*:DeprecationWarning",
    "ignore:unclosed file .*:ResourceWarning",
]
